apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-chatbot
  labels:
    app: fast-api-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fast-api-chatbot
  template:
    metadata:
      labels:
        app: fast-api-chatbot
    spec:
      containers:
        - name: fast-api-chatbot
          image: 8089278330/fast-api-chatbot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"